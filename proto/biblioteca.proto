syntax = "proto3";

package biblioteca;

// Serviço de empréstimo de livros de uma biblioteca.
service Biblioteca {
  // Lista os Usuários cadastrados.
  rpc ListarUsuarios(ListarUsuariosRequest) returns (ListarUsuariosResponse);

  // Lista os Livros do acervo com a disponibilidade de Exemplares.
  rpc ListarLivros(ListarLivrosRequest) returns (ListarLivrosResponse);

  // Informa se o Livro está disponível e a situação de cada Exemplar.
  // Erros: NOT_FOUND "Livro não encontrado".
  rpc ConsultarLivro(ConsultarLivroRequest) returns (ConsultarLivroResponse);

  // Empresta ao Usuário o Exemplar disponível de menor código do Livro.
  // Erros: NOT_FOUND "Usuário não encontrado" / "Livro não encontrado";
  //        INVALID_ARGUMENT "Data inválida";
  //        FAILED_PRECONDITION "Usuário já possui um exemplar deste livro" /
  //          "Usuário com limite de empréstimos atingido" / "Livro indisponível".
  rpc RealizarEmprestimo(RealizarEmprestimoRequest) returns (RealizarEmprestimoResponse);

  // Registra a Devolução do Exemplar do Livro que está com o Usuário, na data de hoje do servidor.
  // Erros: NOT_FOUND "Usuário não encontrado" / "Livro não encontrado" / "Empréstimo não encontrado";
  //        FAILED_PRECONDITION "Livro já devolvido".
  rpc DevolverLivro(DevolverLivroRequest) returns (DevolverLivroResponse);

  // Lista os Empréstimos ativos do Usuário, com data limite e situação (no prazo/atrasado).
  // Erros: NOT_FOUND "Usuário não encontrado".
  rpc ConsultarEmprestimosUsuario(ConsultarEmprestimosUsuarioRequest)
      returns (ConsultarEmprestimosUsuarioResponse);

  // Histórico de Empréstimos de todos os Exemplares do Livro, do mais recente para o mais antigo.
  // Erros: NOT_FOUND "Livro não encontrado".
  rpc ConsultarEmprestimosLivro(ConsultarEmprestimosLivroRequest)
      returns (ConsultarEmprestimosLivroResponse);
}

message Usuario {
  string codigo = 1; // ex.: "U001"
  string nome = 2;
}

message Livro {
  string codigo = 1; // ex.: "L001"
  string titulo = 2;
  string autor = 3;
  int32 disponiveis = 4; // Exemplares sem Empréstimo ativo
  int32 total = 5;       // total de Exemplares
}

message Exemplar {
  string codigo = 1;          // ex.: "L001-1"
  bool disponivel = 2;
  // Preenchidos apenas quando o Exemplar está emprestado:
  string codigo_usuario = 3;
  string nome_usuario = 4;
  string data_emprestimo = 5; // AAAA-MM-DD
}

// Situação de um Empréstimo ativo em relação à data de hoje do servidor.
enum Situacao {
  SITUACAO_NAO_ESPECIFICADA = 0;
  SITUACAO_NO_PRAZO = 1; // hoje <= data limite
  SITUACAO_ATRASADO = 2; // hoje > data limite
}

message ListarUsuariosRequest {}

message ListarUsuariosResponse {
  repeated Usuario usuarios = 1;
}

message ListarLivrosRequest {}

message ListarLivrosResponse {
  repeated Livro livros = 1;
}

message ConsultarLivroRequest {
  string codigo_livro = 1;
}

message ConsultarLivroResponse {
  Livro livro = 1;
  repeated Exemplar exemplares = 2;
}

message RealizarEmprestimoRequest {
  string codigo_usuario = 1;
  string codigo_livro = 2;
  string data_emprestimo = 3; // AAAA-MM-DD; não pode ser futura
}

message RealizarEmprestimoResponse {
  string codigo_exemplar = 1;
  string data_emprestimo = 2;
  string data_limite = 3;     // data_emprestimo + 7 dias
}

message DevolverLivroRequest {
  string codigo_usuario = 1;
  string codigo_livro = 2;
}

message DevolverLivroResponse {
  string codigo_exemplar = 1;
  string data_devolucao = 2;
}

message ConsultarEmprestimosUsuarioRequest {
  string codigo_usuario = 1;
}

message EmprestimoDoUsuario {
  string codigo_livro = 1;
  string titulo = 2;
  string codigo_exemplar = 3;
  string data_emprestimo = 4;
  string data_limite = 5;
  Situacao situacao = 6;
}

message ConsultarEmprestimosUsuarioResponse {
  repeated EmprestimoDoUsuario emprestimos = 1; // vazia se não houver Empréstimos ativos
}

message ConsultarEmprestimosLivroRequest {
  string codigo_livro = 1;
}

message EmprestimoDoLivro {
  string codigo_usuario = 1;
  string nome_usuario = 2;
  string codigo_exemplar = 3;
  string data_emprestimo = 4;
  string data_devolucao = 5; // vazia enquanto o Empréstimo está ativo
}

message ConsultarEmprestimosLivroResponse {
  repeated EmprestimoDoLivro emprestimos = 1; // vazia se o Livro nunca foi emprestado
}
